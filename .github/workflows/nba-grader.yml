name: NBA Grader

on:
  schedule:
    - cron: '0 2,10 * * *'
      timezone: America/New_York
  workflow_dispatch:

concurrency:
  group: nba-sheet-writer
  cancel-in-progress: false

jobs:
  run-nba-grader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NBA_SHEET_ID: ${{ vars.NBA_SHEET_ID }}
      NBA_BACKUP_DIR: nba_backups
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-nba.txt

      - name: Run NBA grader
        run: python -u NBAGrader5-4.py

      - name: Save Sheet backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-grader-backups-${{ github.run_id }}-${{ github.run_attempt }}
          path: nba_backups/
          retention-days: 7
          if-no-files-found: ignore
