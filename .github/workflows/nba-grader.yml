name: NBA Grader

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  run-nba-grader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytz gspread google-auth nba_api

      - name: Run NBA grader
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("NBAGrader5-4.py")
          text = src.read_text()
          lines = [line for line in text.splitlines() if not line.lstrip().startswith('!pip ')]
          Path("/tmp/NBAGrader5-4.run.py").write_text("\n".join(lines) + "\n")
          PY
          python /tmp/NBAGrader5-4.run.py
