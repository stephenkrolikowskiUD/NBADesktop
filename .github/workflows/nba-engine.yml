name: NBA Engine

on:
  schedule:
    - cron: '0 10,18,21 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      slate_date:
        description: 'Slate: next, today, or YYYY-MM-DD (opening day: 2026-10-20)'
        required: false
        default: 'next'
        type: string

concurrency:
  group: nba-sheet-writer
  cancel-in-progress: false

jobs:
  run-nba-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NBA_SLATE_DATE: ${{ github.event_name == 'schedule' && 'today' || inputs.slate_date || 'next' }}
      NBA_SHEET_ID: ${{ vars.NBA_SHEET_ID }}
      NBA_BACKUP_DIR: nba_backups
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-nba.txt

      - name: Run NBA engine
        run: python -u NBAEnginev5-4.py

      - name: Save Sheet backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-engine-backups-${{ github.run_id }}-${{ github.run_attempt }}
          path: nba_backups/
          retention-days: 7
          if-no-files-found: ignore
